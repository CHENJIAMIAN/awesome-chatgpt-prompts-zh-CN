"[TARGETLANGUAGE]\n使用该关键词为首页撰写网站文案。第一部分是英雄区。我需要在这里抓住访客的注意力。标题应该说明他们需要什么。如果他们拥有它，它如何能让他们的生活更美好。它应该包含一个行动号召。构建 StoryBrand 就是让你的客户成为故事中的英雄。七大理念：客户是英雄，而不是你的品牌。公司倾向于销售外部问题的解决方案，但客户购买的是内部问题的解决方案。客户不是在寻找另一个英雄；他们在寻找一位向导。所有文案的定位都不应直接称客户为英雄，而应让他们感觉自己找到了所需的向导，以便他们能够成为英雄，而无需说他们是英雄。\n\n第2部分是问题部分。使用关键词简要撰写这一部分，同时说明他们的问题是什么。不要写如何解决它。这一部分是为了共情并承认他们正面临的挣扎。强调他们可能有的感受。包含与第1部分相同的行动号召。\n\n第3部分是价值部分。突出几个要点，以展示选择这家公司作为你的向导的价值。我们想向他们展示他们能实现什么，以及在我们成功引导他们之后他们会有什么感受。包含相同的行动号召。\n\n第4部分是向导部分。作为一家公司，我们将把自己定位为向导，帮助我们的客户解决问题并获胜。如果我们这样做，客户很可能会与我们做生意，因为他们知道我们在帮助他们获胜。永远记住，这不是关于我们或企业；这完全是关于我们的客户。\n在这一部分，你将向他们介绍你自己，并迅速过渡到你的共情和权威。不要谈论你自己，只谈论你的共情和权威。你与他们如何相似。他们如何能信任你。\n\n第5部分是计划部分\n在这一部分，我们需要三个简单易行的步骤，你的客户可以遵循。\n以下是计划部分的最佳实践：\n步骤1：他们需要做什么。这可以是“注册”\n步骤2：他们将得到什么。\n步骤3：他们将实现什么。\n\n第6部分是行动号召部分。这是整个首页使用的相同行动号召。这是一个销售或定价部分，你可以在其中列出你的客户将得到什么，并在末尾放置一个“立即购买”按钮。大多数客户在购买前真的想看看产品包含什么，所以这一部分对你的首页有益。此外，你可以看到我们在整个落地页上散布了 CTA 按钮，这样当客户决定购买产品时，他们不必去寻找它。\n\n最后一部分是杂物区。这是你放置你认为首页需要的其他重要内容的地方。但确保不要让它过于拥挤。或者如果你正在重新开发你的网站，并且有一些你网站需要的内容，这是你可以放置它们的地方。\n\n使用以下信息来撰写首页文案 [PROMPT]",
