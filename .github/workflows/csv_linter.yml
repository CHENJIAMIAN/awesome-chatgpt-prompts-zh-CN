name: CSV Linter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CSV files
        run: |
          python3 - <<'PY'
          import csv, glob, sys
          csv.field_size_limit(64 * 1024 * 1024)
          failed = []
          for path in sorted(glob.glob("**/*.csv", recursive=True)):
              if path.startswith(".git/"):
                  continue
              try:
                  with open(path, encoding="utf-8-sig", newline="") as fh:
                      rows = [r for r in csv.reader(fh) if r]
              except Exception as exc:
                  print(f"ERROR: {path}: {exc}")
                  failed.append(path)
                  continue
              widths = {len(r) for r in rows}
              print(f"{path}: {len(rows)} 行, 列数 {sorted(widths)}")
              if len(widths) > 1:
                  print(f"ERROR: {path} 列数不一致")
                  failed.append(path)
          if failed:
              sys.exit(f"CSV 校验失败: {failed}")
          PY

      - name: Check Chinese data files are in sync
        run: |
          python3 - <<'PY'
          import csv
          csv.field_size_limit(64 * 1024 * 1024)
          en = list(csv.DictReader(open("prompts.csv", encoding="utf-8")))
          zh = list(csv.DictReader(open("prompts_zh-CN.csv", encoding="utf-8")))
          print(f"prompts.csv={len(en)} 行, prompts_zh-CN.csv={len(zh)} 行")
          if len(zh) < len(en):
              raise SystemExit("中文数据条数少于英文原文，请检查同步流程")
          PY
